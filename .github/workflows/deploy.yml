name: Deploy Full Stack (Direct Key)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get Latest Code
      uses: actions/checkout@v4

    # --- SETUP BACKEND ---
    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, fileinfo

    - name: 🔨 Build Backend
      run: |
        cd backend-laravel
        composer install --no-dev --optimize-autoloader --prefer-dist --ignore-platform-reqs

    # --- SETUP FRONTEND ---
    - name: ⚙️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔨 Build Frontend
      env:
        NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
      run: |
        cd frontend-next
        npm install
        npm run build
        rm -rf node_modules

    # --- DEPLOY (MODIFIED FOR PLAIN TEXT) ---
    - name: 🚀 Deploy Files
      run: |
        mkdir -p ~/.ssh
        
        # FIX: WRITE THE KEY DIRECTLY TO FILE (NO DECODING)
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        
        chmod 600 ~/.ssh/id_rsa
        
        # Add Known Host
        ssh-keyscan -p ${{ secrets.REMOTE_PORT }} -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts

        # Run Rsync
        rsync -avz -e "ssh -p ${{ secrets.REMOTE_PORT }} -i ~/.ssh/id_rsa" \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='backend-laravel/.env' \
          --exclude='frontend-next/.env' \
          --exclude='backend-laravel/storage/logs/' \
          ./ ${{ secrets.CPANEL_USER }}@${{ secrets.HOST_IP }}:/home/${{ secrets.CPANEL_USER }}/repositories/titec_project/

    # --- RESTART ---
    - name: 🧹 Restart Server Services
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        script: |
          cd /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/backend-laravel
          php artisan migrate --force
          php artisan config:cache
          
          cd /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/frontend-next
          export PATH="/opt/cpanel/ea-nodejs20/bin:$PATH"
          npm install --production
          mkdir -p tmp
          touch tmp/restart.txt