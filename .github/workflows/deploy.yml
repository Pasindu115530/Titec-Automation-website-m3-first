name: Deploy Next.js Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        # මෙතන folder නම නිවැරදි කළා
        run: npm install
        working-directory: frontend-next

      - name: Build Project
        run: npm run build
        working-directory: frontend-next

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Build එකෙන් පස්සේ හැදෙන folder එකේ path එක
          local-dir: ./frontend-next/out/ 
          # cPanel එකේ ඔයා හදපු App Root folder එකේ නම (මේක කලින් frontend කියලා නේද දුන්නේ?)
          server-dir: frontend/
