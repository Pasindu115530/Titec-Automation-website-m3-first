name: Deploy Full Stack (Zip & Ship)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Get Code
    - name: 🚚 Get Latest Code
      uses: actions/checkout@v4

    # --- PART A: BUILD BACKEND ---
    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, fileinfo

    - name: 🔨 Build Backend
      run: |
        cd backend-laravel
        composer install --no-dev --optimize-autoloader --prefer-dist --ignore-platform-reqs

    # --- PART B: BUILD FRONTEND ---
    - name: ⚙️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔨 Build Frontend
      env:
        NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
      run: |
        cd frontend-next
        npm install
        npm run build
        rm -rf node_modules

    # --- PART C: COMPRESS FILES (The Fix for No Rsync) ---
    - name: 📦 Create Deployment Archive
      run: |
        tar -czf deploy_package.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='backend-laravel/.env' \
          --exclude='frontend-next/.env' \
          --exclude='backend-laravel/storage/logs' \
          backend-laravel frontend-next

    # --- PART D: UPLOAD & DEPLOY ---
    
    # 1. Ensure Folder Exists on Server
    - name: 📂 Prepare Server Directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        script: |
          mkdir -p /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/

    # 2. Upload the Zip File (SCP)
    - name: 🚀 Upload Archive
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        source: "deploy_package.tar.gz"
        target: "/home/${{ secrets.CPANEL_USER }}/repositories/titec_project/"

    # 3. Unzip & Restart
    - name: 🧹 Extract & Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        script: |
          cd /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/
          
          # Clean old build artifacts to prevent stale chunks
          rm -rf frontend-next/.next

          # Extract and Overwrite
          tar -xzf deploy_package.tar.gz
          rm deploy_package.tar.gz
          
          # Finalize Laravel
          cd backend-laravel
          php artisan migrate --force
          php artisan config:cache
          
          # Finalize Frontend
          cd ../frontend-next
          export PATH="/opt/cpanel/ea-nodejs20/bin:$PATH"
          npm install --production
          
          # Restart App
          mkdir -p tmp
          touch tmp/restart.txt