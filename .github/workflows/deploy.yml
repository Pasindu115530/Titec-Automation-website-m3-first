name: Deploy Full Stack (Laravel + Next.js)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub එකෙන් අලුත්ම code එක ලබා ගැනීම
    - name: 🚚 Get Latest Code
      uses: actions/checkout@v4

    # --- PART A: PREPARE LARAVEL (BACKEND) ---
    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, fileinfo

    - name: 🔨 Build Backend
      run: |
        cd backend-laravel
        composer install --no-dev --optimize-autoloader --prefer-dist --ignore-platform-reqs

    # --- PART B: PREPARE NEXT.JS (FRONTEND) ---
    - name: ⚙️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔨 Build Frontend
      run: |
        cd frontend-next
        npm install
        npm run build
        # Upload speed එක වැඩි කිරීමට node_modules අයින් කරයි
        rm -rf node_modules

    # --- PART C: TRANSFER FILES (RSYNC via SSH) ---
    - name: 🚀 Deploy via SSH (Rsync)
      uses: easingthemes/ssh-deploy@v5.0.0
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.HOST_IP }}
        REMOTE_USER: ${{ secrets.CPANEL_USER }}
        REMOTE_PORT: '1243' 
        
        SOURCE: "/" 
        TARGET: "/home/${{ secrets.CPANEL_USER }}/repositories/titec_project/"
        
        # .env සහ storage files overwrite වීම වැළැක්වීමට
        EXCLUDE: "/.git/, /.github/, /backend-laravel/.env, /frontend-next/.env, /backend-laravel/storage/logs/"
        
        ARGS: "-rltgoDzvO --delete"

    # --- PART D: RESTART & FINALIZE ---
    - name: 🧹 Restart Server Services
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 7822
        script: |
          # 1. Laravel Backend එක finalize කිරීම
          cd /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/backend-laravel
          php artisan migrate --force
          php artisan config:cache

          # 2. Frontend එක finalize කිරීම
          cd /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/frontend-next
          export PATH="/opt/cpanel/ea-nodejs20/bin:$PATH"
          npm install --production
          
          # 3. Node.js App එක restart කිරීම
          mkdir -p tmp
          touch tmp/restart.txt
