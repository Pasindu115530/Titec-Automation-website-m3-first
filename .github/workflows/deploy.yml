name: Deploy Full Stack (Zip & Ship)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get Latest Code
      uses: actions/checkout@v4

    # --- PART A: BUILD BACKEND ---
    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, fileinfo

    - name: 🔨 Build Backend
      run: |
        cd backend-laravel
        composer install --no-dev --optimize-autoloader --prefer-dist --ignore-platform-reqs

    # --- PART B: BUILD FRONTEND ---
    - name: ⚙️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔨 Build Frontend
      env:
        NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      run: |
        cd frontend-next
        npm install
        npm run build
        rm -rf node_modules

    # --- PART C: COMPRESS FILES ---
    - name: 📦 Create Deployment Archive
      run: |
        tar -czf deploy_package.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='backend-laravel/.env' \
          --exclude='frontend-next/.env' \
          --exclude='backend-laravel/storage/logs' \
          backend-laravel frontend-next

    # --- PART D: UPLOAD & DEPLOY ---
    - name: 📂 Prepare Server Directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        script: |
          mkdir -p /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/

    - name: 🚀 Upload Archive
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        source: "deploy_package.tar.gz"
        target: "/home/${{ secrets.CPANEL_USER }}/repositories/titec_project/"

    - name: 🧹 Extract, Clean & Force Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        script: |
          cd /home/${{ secrets.CPANEL_USER }}/repositories/titec_project/
          
          # 1. Force Kill - පරණ Node processes සම්පූර්ණයෙන්ම නවත්වන්න (Ghost Processes අයින් කිරීමට)
          pkill -u ${{ secrets.CPANEL_USER }} node || true
          
          # 2. පරණ build artifacts අයින් කිරීම
          rm -rf frontend-next/.next

          # 3. Extract and Overwrite
          tar -xzf deploy_package.tar.gz
          rm deploy_package.tar.gz
          
          # 4. Finalize Laravel (Cache clear කර අලුත් config load කිරීම)
          cd backend-laravel
          php artisan migrate --force
          php artisan config:clear
          php artisan cache:clear
          php artisan config:cache
          
          # 5. Restart App (Passenger trigger)
          # NOTE: No npm install needed — the .next build is self-contained.
          # Running npm install here caused postinstall hooks to overwrite src/ files.
          cd ../frontend-next
          mkdir -p tmp
          touch tmp/restart.txt
